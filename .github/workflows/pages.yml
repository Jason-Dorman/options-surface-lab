name: Test and deploy to Pages

# FR-9 / T-9. The published site is a SINGLE self-contained index.html, built from the
# committed pickle at build time — Python reads option_pipeline_data.pkl here in CI, renders
# the Plotly figures, and embeds their data as JSON in the file. The browser never touches
# the pickle and there is no server at run time.
#
# Why not `reflex export`: a Reflex static export still ships a client that opens a websocket
# to a Python backend (ws://localhost:8000/_event baked into the bundle). GitHub Pages runs
# no Python, so hydration fails and the page renders blank. Measured 2026-08-31; see
# ARCHITECTURE AD-4. The Reflex app remains the local dev app — only the published artifact
# differs, which is what AD-5 already anticipated.
#
# Consequence: no Reflex event handlers in production, so every published interaction must be
# Plotly-native (T-15).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Forces the synthetic path and makes any LSEG call impossible, so a network fetch can
  # never sneak into a build. If the pickle is committed this changes nothing.
  OSL_OFFLINE: "1"

jobs:
  test:
    name: pytest (no credentials — proves NFR-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest tests/ -q

  build:
    name: Build the static page
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Two pages now (T-79): Assignment 1.1 at the site root, so the URL already submitted
      # on Canvas keeps working, and Assignment 2 at /covered-call/. Each builder writes
      # straight into _site — the route it publishes to is `page_shell.SITE_PATHS`, and
      # tests/ pins those paths to this file so the build step and the guards below cannot
      # drift from where the pages actually land.
      - name: Build both pages from the committed data
        run: |
          set -euo pipefail
          mkdir -p _site
          python build_preview.py --site _site
          python build_covered_call.py --site _site
          # Pages runs Jekyll by default and strips paths beginning with "_".
          touch _site/.nojekyll

      # The build must fail loudly rather than publish a page built on generated data. A
      # synthetic deploy would look plausible and be wrong — 1.1's fallback invents settles
      # that do not exist in the real data (notebook 01 §10b), and a synthetic covered-call
      # tape is ten plausible weeks of a market that never happened.
      #
      # The guards are PER PAGE: each page gets the checks its own content supports, and a
      # marker is never shared between them, or one page's fabrication would pass the
      # other's check.
      - name: Refuse to publish an empty or fabricated page
        run: |
          set -euo pipefail

          # ---- every page ----
          # Non-empty, and reachable from the rest of the site. A page nothing links to is
          # published and invisible, which no render can show.
          for p in _site/index.html _site/covered-call/index.html; do
            test -s "$p" || { echo "::error::$p is empty or was never written"; exit 1; }
            grep -q 'class="osl-nav"' "$p" || {
              echo "::error::$p carries no link to the rest of the site"; exit 1; }
          done

          # ---- Assignment 1.1 — the site root ----
          page=_site/index.html
          if grep -q "synthetic panel" "$page"; then
            echo "::error::page was built from the synthetic fallback — is option_pipeline_data.pkl committed?"
            exit 1
          fi
          grep -q "plotly-graph-div" "$page" || { echo "::error::no Plotly figures in the page"; exit 1; }
          figs=$(grep -o "plotly-graph-div" "$page" | wc -l)
          echo "published page carries $figs figures"
          test "$figs" -ge 7 || { echo "::error::expected at least 7 figures, found $figs"; exit 1; }
          # FR-11's IV panel is the one figure that is a model output rather than data, so
          # the page must always say so on its face. A silent restyle that dropped the
          # assumptions line would leave a vol surface with no stated rate.
          # Phrases chosen to survive Plotly's JSON encoder: no "/" (written /) and no
          # "·" (the caption's separators are &nbsp;·&nbsp;). tests/test_build_preview.py
          # pins this list to the page so a reworded caption cannot orphan the guard.
          for phrase in "American exercise ignored" "no dividends" "European Black-Scholes" "Not a tradable price"; do
            grep -q "$phrase" "$page" || { echo "::error::the IV panel shipped without its assumptions caption ($phrase)"; exit 1; }
          done
          # FR-7's three sentences are the one graded element with no figure behind them,
          # so their absence is invisible on a page that otherwise renders perfectly. The
          # block must be there, and no slot may still be empty. Both strings are plain
          # ASCII and structural rather than prose, so a copy edit to the sentences
          # themselves cannot orphan the guard (see IV_PAGE_MARKERS above for how that
          # happened once). tests/test_build_preview.py pins both to the page.
          grep -q "osl-commentary" "$page" || { echo "::error::FR-7's commentary block is missing from the page"; exit 1; }
          if grep -qF "[unwritten]" "$page"; then
            echo "::error::an FR-7 sentence is still unwritten — see options_surface_lab/commentary.py"
            exit 1
          fi
          # The as-of slider drives the whole page (AD-5). Without the frames payload and its
          # listener the hero moves and every other panel stays on its build-time date, which
          # renders perfectly and shows two different as-of dates at once — invisible to the
          # figure count above, so it gets its own check.
          grep -q 'id="osl-frames"' "$page" || { echo "::error::per-date frames missing — the slider would move the hero only"; exit 1; }
          grep -q "plotly_sliderchange" "$page" || { echo "::error::nothing listens to the as-of slider"; exit 1; }

          # ---- Assignment 2 — /covered-call/ ----
          page=_site/covered-call/index.html
          if grep -q "synthetic tape" "$page"; then
            echo "::error::the covered-call page was built from the synthetic tape — is covered_call_tape.parquet committed?"
            exit 1
          fi
          # The readouts are the whole book in six numbers. An empty strip means
          # run_backtest returned nothing and the page rendered its frame around it.
          grep -q "data-osl-readout" "$page" || {
            echo "::error::the covered-call page carries no readouts — the book is empty"; exit 1; }
          # SPEC §11's per-page guards, landed with the panels they guard (T-59). The
          # phrases are pinned to the page by tests/test_build_covered_call.py, because a
          # grep guard is orphaned by a copy edit and then passes forever (T-45).
          grep -q "plotly-graph-div" "$page" || {
            echo "::error::no Plotly figures on the covered-call page"; exit 1; }
          figs=$(grep -o "plotly-graph-div" "$page" | wc -l)
          test "$figs" -ge 2 || {
            echo "::error::expected FR-16's account chart and FR-17's scatter, found $figs"; exit 1; }
          # A book with no trades renders perfectly and is wrong: every table is present,
          # every heading is right, and the strategy simply never fired.
          grep -q ">BUY</td>" "$page" || {
            echo "::error::the blotter booked no entry — the book is empty"; exit 1; }
          if ! grep -q ">EXPIRE</td>" "$page" && ! grep -q ">ASSIGN</td>" "$page"; then
            echo "::error::no week ever resolved — every position is still open"; exit 1
          fi
          # FR-17's fit. Plain ASCII with no "/" and no "·" on purpose: the caption exists
          # twice in the page, once inside the figure's JSON, where Plotly writes a forward
          # slash as / and would never match a guard spanning one.
          grep -q "Fill assumption:" "$page" || {
            echo "::error::FR-17's fit line is missing — the fill assumption is unstated"; exit 1; }
          # FR-19, the FR-7 mechanism inherited whole: the write-up is the one graded
          # element on this page with no figure behind it, so an unwritten slot is
          # invisible on a page that otherwise renders perfectly.
          #
          # Downgraded to a WARNING on 2026-09-18 at the PO's request, so the page could be
          # looked at before the prose existed, and **restored the same day** when the PO
          # wrote all five answers (T-60). It did not need anyone to remember:
          # tests/test_build_covered_call.py reads this line and FAILS if the posture and
          # `writeup.ANSWERS` disagree, so the waiver expired by itself the moment the
          # write-up landed. A waiver that cannot expire is a deleted guard with extra steps.
          if grep -qF "[unwritten]" "$page"; then
            echo "::error::an FR-19 write-up answer is still unwritten — see options_surface_lab/covered_call/writeup.py (T-60)"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
