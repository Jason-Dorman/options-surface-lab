name: Test and deploy to Pages

# FR-9 / T-9. The published site is a SINGLE self-contained index.html, built from the
# committed pickle at build time — Python reads option_pipeline_data.pkl here in CI, renders
# the Plotly figures, and embeds their data as JSON in the file. The browser never touches
# the pickle and there is no server at run time.
#
# Why not `reflex export`: a Reflex static export still ships a client that opens a websocket
# to a Python backend (ws://localhost:8000/_event baked into the bundle). GitHub Pages runs
# no Python, so hydration fails and the page renders blank. Measured 2026-08-31; see
# ARCHITECTURE AD-4. The Reflex app remains the local dev app — only the published artifact
# differs, which is what AD-5 already anticipated.
#
# Consequence: no Reflex event handlers in production, so every published interaction must be
# Plotly-native (T-15).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Forces the synthetic path and makes any LSEG call impossible, so a network fetch can
  # never sneak into a build. If the pickle is committed this changes nothing.
  OSL_OFFLINE: "1"

jobs:
  test:
    name: pytest (no credentials — proves NFR-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest tests/ -q

  build:
    name: Build the static page
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build index.html from the committed pickle
        run: |
          set -euo pipefail
          python build_preview.py
          mkdir -p _site
          cp options_surface_preview.html _site/index.html
          # Pages runs Jekyll by default and strips paths beginning with "_".
          touch _site/.nojekyll

      # The build must fail loudly rather than publish a page built on the fallback panel.
      # A synthetic deploy would look plausible and be wrong — it invents settles that do
      # not exist in the real data (see checkpoint_audit.md §3).
      - name: Refuse to publish synthetic data or an empty page
        run: |
          set -euo pipefail
          page=_site/index.html
          test -s "$page" || { echo "::error::index.html is empty"; exit 1; }
          if grep -q "synthetic panel" "$page"; then
            echo "::error::page was built from the synthetic fallback — is option_pipeline_data.pkl committed?"
            exit 1
          fi
          grep -q "plotly-graph-div" "$page" || { echo "::error::no Plotly figures in the page"; exit 1; }
          figs=$(grep -o "plotly-graph-div" "$page" | wc -l)
          echo "published page carries $figs figures"
          test "$figs" -ge 7 || { echo "::error::expected at least 7 figures, found $figs"; exit 1; }
          # FR-11's IV panel is the one figure that is a model output rather than data, so
          # the page must always say so on its face. A silent restyle that dropped the
          # assumptions line would leave a vol surface with no stated rate.
          # Phrases chosen to survive Plotly's JSON encoder: no "/" (written /) and no
          # "·" (the caption's separators are &nbsp;·&nbsp;). tests/test_build_preview.py
          # pins this list to the page so a reworded caption cannot orphan the guard.
          for phrase in "American exercise ignored" "no dividends" "European Black-Scholes" "Not a tradable price"; do
            grep -q "$phrase" "$page" || { echo "::error::the IV panel shipped without its assumptions caption ($phrase)"; exit 1; }
          done
          # The as-of slider drives the whole page (AD-5). Without the frames payload and its
          # listener the hero moves and every other panel stays on its build-time date, which
          # renders perfectly and shows two different as-of dates at once — invisible to the
          # figure count above, so it gets its own check.
          grep -q 'id="osl-frames"' "$page" || { echo "::error::per-date frames missing — the slider would move the hero only"; exit 1; }
          grep -q "plotly_sliderchange" "$page" || { echo "::error::nothing listens to the as-of slider"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
